<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8e6c8" />
    <title>From me to you</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="love-body">
    <div class="flower-layer" aria-hidden="true"></div>
    <main class="surprise-page love-page">
      <section class="love-section love-hero" aria-labelledby="love-title">
        <img
          class="dried-roses"
          src="64413c24-199f-423f-b325-1a4ab235062e.png"
          alt=""
          aria-hidden="true"
        />
        <div class="love-hero__content">
          <h1 class="love-title" id="love-title">From me to you.</h1>
          <p class="love-subtitle">This is how much I love you my bestie.</p>
          <img
            class="couple-illustration"
            src="f3205c14-11c8-4d8c-9dcf-760e15db3b84.png"
            alt="A sweet illustration of a couple holding hands"
          />
          <a class="scroll-cue" href="#love-note" aria-label="Scroll to the love note">
            <span aria-hidden="true">✦ &nbsp;♡&nbsp; ✦</span>
          </a>
        </div>
      </section>

      <section class="love-section love-note" id="love-note" aria-label="A love note">
        <span class="scroll-cue scroll-cue--top" aria-hidden="true">✦ &nbsp;♡&nbsp; ✦</span>
        <article class="love-card">
          <span class="love-card__decoration love-card__decoration--one" aria-hidden="true">♥</span>
          <span class="love-card__decoration love-card__decoration--two" aria-hidden="true">❀</span>
          <p>
            In your <span class="word word--smile">smile</span>, I found my
            <span class="word word--peace">peace</span>.
          </p>
          <p>
            In your <span class="word word--love">love</span>, I found my
            <span class="word word--home">home</span>.
          </p>
          <span class="love-card__decoration love-card__decoration--three" aria-hidden="true">✧</span>
          <span class="love-card__decoration love-card__decoration--four" aria-hidden="true">♥</span>
        </article>
        <a class="scroll-cue scroll-cue--bottom" href="#secret" aria-label="Scroll to your surprise">
          <span aria-hidden="true">✦ &nbsp;♡&nbsp; ✦</span>
        </a>
      </section>

      <section class="love-section love-secret" id="secret" aria-label="Your next surprise">
        <a class="lock-link" href="3.html" aria-label="Open the next surprise">
          <img
            class="lock-image"
            src="5b7d2868-b834-4d7c-8d3a-40167ef6214f_removalai_preview.png"
            alt="A tiny heart lock"
          />
        </a>
        <p class="lock-hint">tap to open</p>
      </section>
    </main>
    <script src="script.js" defer></script>
  </body>
</html>
